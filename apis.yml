name: Scoopola
description: >-
  Scoopola was an early-stage consumer startup backed by 500 Startups (Batch 2, June 2011),
  pitched as "the HotelTonight for live music and theater" — a mobile app for discovering and
  buying last-minute, discounted tickets to local live-music and theater events. The company
  appears defunct; its associated web domains (getwillcall.com and scoopola.com) no longer
  resolve, and there is no surviving developer portal, documentation, or public API surface.
  This record is retained as a historical portfolio-lead stub; the enrichment pipeline found
  no live API to catalog.
